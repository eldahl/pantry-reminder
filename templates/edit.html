<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - Pantry Reminder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="/">Add Item</a></li>
            <li><a href="/list">All Items</a></li>
            <li><a href="/settings">Settings</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Edit Item</h1>

        {{if .ImagePath}}
        <img src="/{{.ImagePath}}" alt="{{.Name}}" class="item-image">
        {{end}}

        <form action="/edit-item" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="id" value="{{.ID}}">

            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" value="{{.Name}}" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{.Description}}</textarea>

            <label for="expiration_date">Expiration Date</label>
            <input type="date" id="expiration_date" name="expiration_date"
                value="{{.ExpirationDate.Format "2006-01-02"}}" required>

            <label for="reminder_days">Reminder Days (before expiration)</label>
            <input type="number" id="reminder_days" name="reminder_days" value="{{.ReminderDays}}" min="1">

            <label>Tags</label>
            <div id="tagInputContainer" class="tag-input-container">
                <div class="tag-input-row">
                    <input type="text" class="tag-text-input" placeholder="Add a tag">
                    <button type="button" class="tag-add-btn search-btn">Add</button>
                </div>
                <div class="tag-list"></div>
                <div class="tag-hidden-inputs"></div>
            </div>

            <label for="image">Replace Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/*" capture="environment">

            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="/item?id={{.ID}}" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>

    <script src="/static/tags.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTagInput('tagInputContainer', [
                {{range $i, $t := .Tags}}{{if $i}}, {{end}}{{printf "%q" $t}}{{end}}
            ]);
        });
    </script>
</body>

</html>
